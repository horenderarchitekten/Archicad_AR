<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchiCAD AR Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/three.js/ar.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #arContainer {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(32, 40, 26, 0.9);
            color: #cde61e;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            max-width: 90%;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(32, 40, 26, 0.9);
            color: #cde61e;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-width: 280px;
        }
        
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #cde61e;
            background: rgba(32, 40, 26, 0.95);
            padding: 30px;
            border-radius: 10px;
            z-index: 200;
        }
        
        .spinner {
            border: 4px solid rgba(205, 230, 30, 0.3);
            border-top: 4px solid #cde61e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 100, 100, 0.95);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
            z-index: 200;
        }
        
        button {
            background: #cde61e;
            color: #202a1a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        
        button:hover {
            background: #b8d615;
        }
    </style>
</head>
<body>
    <div id="arContainer">
        <div id="info" class="info">
            <strong>AR Gebäudevisualisierung</strong><br>
            Halte dein Handy über den Marker auf dem Plan.<br><br>
            <small>• Plan halten<br>• Marker erkennen lassen<br>• Gebäude sehen</small>
        </div>
        
        <div id="loader" class="loader" style="display: none;">
            <div class="spinner"></div>
            <div>Lädt Modell...</div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="controls" class="controls" style="display: none;">
            <div>✓ Marker erkannt!</div>
            <small>Drehe den Plan um das Gebäude zu rotieren</small>
        </div>
    </div>

    <script>
        // Konfiguration
        const CONFIG = {
            // WICHTIG: Diese URL anpassen auf dein gehostetes GLB-Modell
            modelUrl: './model.glb', // Ersetze mit deinem ArchiCAD-Export
            markerUrl: 'https://raw.githubusercontent.com/jeromeetienne/AR.js/master/data/data/hiro.patt',
            scale: 1.0, // Skalierung des Modells
            positionZ: 0 // Z-Position (Höhe über dem Plan)
        };

        let scene, camera, renderer, model;
        let markerGroup, modelGroup;
        let modelLoaded = false;

        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `<strong>Fehler:</strong><br>${message}`;
            errorDiv.style.display = 'block';
            hideLoader();
        }

        function showControls() {
            document.getElementById('controls').style.display = 'block';
        }

        function initAR() {
            // Scene, Camera, Renderer
            scene = new THREE.Scene();
            camera = new THREE.Camera();
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(new THREE.Color('lightgrey'), 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.getElementById('arContainer').appendChild(renderer.domElement);

            // AR.js Source und Context
            const arSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });
            arSource.init(() => {
                setTimeout(() => {
                    onSourceReady(arSource);
                }, 1);
            });

            // AR Context
            const arContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'https://raw.githubusercontent.com/jeromeetienne/ar.js/master/data/data/camera_para.dat',
                detectionMode: 'mono',
                sourceWidth: arSource.parameters.sourceWidth,
                sourceHeight: arSource.parameters.sourceHeight,
            });

            arContext.init(() => {
                camera.projectionMatrix.copy(arContext.getProjectionMatrix());
            });

            // Marker Group
            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            // THREEx Marker Controls
            const markerControls = new THREEx.ArMarkerControls(arContext, markerGroup, {
                type: 'pattern',
                patternUrl: CONFIG.markerUrl,
            });

            // Model Group (für Rotation und Skalierung)
            modelGroup = new THREE.Group();
            markerGroup.add(modelGroup);

            // Lichter hinzufügen
            const light1 = new THREE.DirectionalLight(0xffffff, 0.7);
            light1.position.set(5, 5, 5);
            modelGroup.add(light1);

            const light2 = new THREE.AmbientLight(0xffffff, 0.5);
            modelGroup.add(light2);

            // Modell laden
            loadModel();

            // Handle resize
            window.addEventListener('resize', () => {
                arSource.onResize();
                arSource.copySizeTo(renderer.domElement);
                if (camera.aspect !== window.innerWidth / window.innerHeight) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                }
            });

            // Animation loop
            const animate = () => {
                requestAnimationFrame(animate);
                arContext.update(arSource.domElement);
                renderer.render(scene, camera);
            };
            animate();
        }

        function onSourceReady(source) {
            THREEx.ArToolkitSource.prototype.onResize.call(source);
            source.copySizeTo(renderer.domElement);
            if (camera.aspect !== window.innerWidth / window.innerHeight) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }

        function loadModel() {
            showLoader();
            const loader = new THREE.GLTFLoader();

            loader.load(
                CONFIG.modelUrl,
                (gltf) => {
                    model = gltf.scene;
                    
                    // Modell skalieren
                    model.scale.set(CONFIG.scale, CONFIG.scale, CONFIG.scale);
                    
                    // Modell zentrieren und positionieren
                    const bbox = new THREE.Box3().setFromObject(model);
                    const center = bbox.getCenter(new THREE.Vector3());
                    model.position.sub(center);
                    model.position.z = CONFIG.positionZ;
                    
                    modelGroup.add(model);
                    
                    // Materials optimieren
                    model.traverse((child) => {
                        if (child instanceof THREE.Mesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    modelLoaded = true;
                    hideLoader();
                    showControls();
                },
                (progress) => {
                    // Loading progress
                },
                (error) => {
                    console.error('Fehler beim Laden des Modells:', error);
                    showError(`Modell konnte nicht geladen werden.<br><small>${CONFIG.modelUrl}</small>`);
                }
            );
        }

        // Start AR wenn DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            initAR();
        });

        // Fehlerbehandlung
        window.addEventListener('error', (event) => {
            console.error('Error:', event);
        });
    </script>
</body>
</html>
